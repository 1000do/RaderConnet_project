services:
  user-api:
    container_name: user-api
    build:
      context: .
      dockerfile: UserAPI/Dockerfile
    ports:
      - "8081:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=UserDB;Username=postgres;Password=123456
    depends_on:
      - postgres
    networks:
      - my-shared-network

  postgres:
    image: postgres:15
    container_name: postgres-db
    environment:
      POSTGRES_DB: UserDB
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456
    volumes:
      - ./UserAPI.sql:/docker-entrypoint-initdb.d/init.sql
      # 2. QUAN TRỌNG: Lưu dữ liệu vào thư mục "postgres_data" ở máy thật
      - ./postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - my-shared-network

networks:
  my-shared-network:
    external: true