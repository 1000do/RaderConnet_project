services:
  frontend-web:
    container_name: frontend-web
    build:
      context: .
      dockerfile: LinkedLearn/Dockerfile
    ports:
      - "3000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
    networks:
      - my-shared-network

networks:
  my-shared-network:
    external: true